[project]
name = "nempy"
version = "3.0.3"
description="A flexible tool kit for modelling Australia's National Electricity Market dispatch procedure."
authors = [
    { name = "nick-gorman", email = "n.gorman305@gmail.com" },
]
maintainers = [
    { name = "Gabe Hackebeil", email = "ghackebeil@tesla.com" },
    { name = "Alex Yee", email = "aleyee@tesla.com" },
    { name = "Rahul Khandur", email = "rkhandurbhanuprakash@tesla.com" },
]
dependencies = [
    # Split at 3.10 because that is mip 1.17's floor, not 1.16rc0's ceiling
    # (requires-python <3.13). 1.16rc0's CBC aborts on 3.11+, so 3.10+ takes 1.17.
    "mip==1.16rc0; python_version < '3.10'",
    "mip>=1.17,<2; python_version >= '3.10'",
    "pandas>=1.5",
    "xmltodict==0.12.0",
    "requests>=2.0.0",
]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true
dev-dependencies = [
    "Sphinx>=5.0.0",
    "autodocsumm>=0.2.11",
    "sphinx-rtd-theme>=1.3.0",
    "pytest>=8.3.2",
]

[tool.pytest.ini_options]
# Paths collected by a bare `pytest`. `src` is required for the doctests, which
# carry a large share of the suite.
testpaths = ["src", "tests"]
addopts = [
    "-ra",
    "--doctest-modules",
    # Require a locally built MMSDM database and NEMDE XML cache at hardcoded
    # Windows paths (D:/nempy_2024_07/...), so they cannot run here.
    "--ignore=tests/test_historical.py",
    "--ignore=tests/test_historical_2021.py",
    # Scripts, not tests.
    "--ignore=tests/get_violation_times.py",
    "--ignore=tests/build_historical_test_data_cache_and_db.py",
    # Data fixtures.
    "--ignore=tests/test_files",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "kaleido==0.2.0",
    "plotly>=6.0.0",
]


