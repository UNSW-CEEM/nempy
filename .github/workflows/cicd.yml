name: Run Nempy Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [ created ]
  workflow_dispatch: # manual trigger

jobs:
  test:
    # Matrix testing to test across OSs and Python versions
    # Fail-fast: fail the entire job as soon as anything fails
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # "" resolves freely -- today that means the newest pandas.
        version-constraints:
          - ""
          - "'pandas==3.*'"
          - "'pandas==2.*'"
          - "'pandas==1.*' 'numpy==1.*'"
        exclude:
          # pandas 3 requires Python 3.11+.
          - python-version: "3.9"
            version-constraints: "'pandas==3.*'"
          - python-version: "3.10"
            version-constraints: "'pandas==3.*'"
          # pandas 1.5.3 has no 3.12+ wheels and fails to build from source.
          - python-version: "3.12"
            version-constraints: "'pandas==1.*' 'numpy==1.*'"
          - python-version: "3.13"
            version-constraints: "'pandas==1.*' 'numpy==1.*'"
          - python-version: "3.14"
            version-constraints: "'pandas==1.*' 'numpy==1.*'"
          - python-version: "3.15"
            version-constraints: "'pandas==1.*' 'numpy==1.*'"
          # uv run segfaults for windows on python 3.13
          - os: "windows-latest"
            python-version: '3.13'
          # numpy build issues on macos-latest
          - os: "macos-latest"
            python-version: '3.13'


    # Necessary for Windows
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Resync with restricted versions
        if: ${{ matrix.version-constraints != '' }}
        run: |
          uv pip install ${{ matrix.version-constraints }} --reinstall --strict

      # --no-sync keeps the constrained install from the previous step; a plain
      # `uv run` re-syncs from pyproject.toml and reverts it.
      - name: Report resolved versions
        run: uv run --no-sync python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__); print('numpy', numpy.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest tests src -ra --doctest-modules

  publish:
    if: github.event_name == 'release' && github.event.action == 'created'
    needs: test
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nempy/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4
      # Install uv with cache
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Sync dependencies
      - name: Sync dependencies
        run: uv sync
      # Build
      - name: Build
        run: uv build
      # Publish to PyPI
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

